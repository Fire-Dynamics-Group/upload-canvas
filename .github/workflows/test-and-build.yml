name: Test and build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-and-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-next-build:
    name: Unit tests and next build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          # package.json engines.node is 22.x
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Still typecheck and compile when unit tests fail, so both results show on the PR.
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
